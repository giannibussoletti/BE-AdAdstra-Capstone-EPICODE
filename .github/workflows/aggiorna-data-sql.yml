name: Aggiorna data.sql

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aggiorna:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rigenera data.sql
        run: python scripts/aggiorna_data_sql.py -i src/main/resources/data.sql --giorni 14

      - name: Commit e push se il file è cambiato
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add src/main/resources/data.sql
          git diff --cached --quiet || (git commit -m "Aggiorna data.sql" && git push)
